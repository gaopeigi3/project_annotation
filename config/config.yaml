project:
  name: "project_annotation"
  author: ""
  date: "2026-05-06"

data:
  input_h5ad: "data/raw/input.h5ad"
  # output_h5ad: "data/results/annotated.h5ad"

cohort:
  name: "ven_prepost"
  description: "VEN-treated patients, pre/post treatment"
  filters:
    treattime:
      - "pre"
      - "post"
    drugname:
      - "venetoclax"
    response:
      - "responder"
      - "nonresponder"

params:
  qc:
    min_genes: 200
    max_mt: 0.05

  preprocess:
    n_hvg: 2000
    remove_mt: true
    remove_ribo: true
    min_cells: 3

  integrate:
    method: harmony
    key: sample
    n_pcs: 50

  reduce:
    n_neighbors: 15
    resolution: 0.8

  annotation:
    threshold_main: 0.3
    threshold_sub: 0.4
    version: "0.1.0"
