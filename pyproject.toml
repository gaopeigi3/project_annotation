[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anndata",
    "harmonypy",
    "igraph",
    "leidenalg",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "scanpy",
    "scipy",
]

[project.optional-dependencies]
workflow = ["snakemake>=8"]
api = ["fastapi", "snakemake>=8", "uvicorn[standard]"]
test = ["httpx", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
