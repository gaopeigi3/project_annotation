[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-pipeline"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "scanpy",
    "anndata",
    "harmonypy",
    "numpy",
    "pandas",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]