project:
  name: "project_annotation"
  author: ""
  date: "2026-05-06"

data:
  input_h5ad: "data/raw/input.h5ad"
  # output_h5ad: "data/results/annotated.h5ad"

cohort:
  name: "ven_prepost"
  description: "VEN-treated patients, pre/post treatment"
  filters:
    treattime:
      - "pre"
      - "post"
    drugname:
      - "venetoclax"
    response:
      - "responder"
      - "nonresponder"
      
embedding:
  scope: "global"   # global | subset

params:
  qc:
    min_genes: 200
    max_mt: 0.05
    
  preprocess:
    n_hvg: 2000



slicing:
  structural:   # 改变空间的 slicing（cell-type）
    enabled: false
    filters:
      cell_type:
        - "HSCLSC"
        - "MPPCLP"

analysis_subset: 
  condition:
    treat: ["pre", "post"]
    response: ["responder", "nonresponder"]

preprocessing:
  remove_mt: true
  remove_ribo: true
  min_genes: 200
  min_cells: 3

representation:
  n_pcs: 50
  n_neighbors: 15
  min_dist: 0.5